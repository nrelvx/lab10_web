  <title>Git команди</title>
  <link rel="stylesheet" href="blog.css">
  <style>
    .cheat {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      max-width: 1000px;
      margin: 0 auto;
    }
    @media (max-width: 900px) { .cheat { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 500px) { .cheat { grid-template-columns: 1fr; } }

    .cheat h2 { margin: 0 0 12px; font-size: 20px; }
    .cheat h2:not(:first-child) { margin-top: 26px; }
    .cheat p { margin: 0 0 14px; font-size: 12px; line-height: 1.4; color: #4a4560; }
    .cheat code {
      display: block;
      margin-top: 4px;
      font-family: "Courier New", monospace;
      font-weight: bold;
      color: #1d1a2b;
    }
    .cheat a { color: #5e35b1; }

    .c-create  { color: #7e57c2; }
    .c-observe { color: #3949ab; }
    .c-branch  { color: #00897b; }
    .c-change  { color: #2e7d32; }
    .c-sync    { color: #d81b60; }
    .c-finally { color: #d81b60; }
  </style>
</head>
